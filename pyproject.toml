[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-network-from-scratch"
version = "0.1.0"
description = "A neural network implemented from scratch using Python and NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "python-mnist"
]

[tool.setuptools.packages.find]
where = ["src"]